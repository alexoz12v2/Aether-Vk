[package]
name = "aethervk-core-rlib"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[lib]
name = "aethervk_core_rlib"
crate-type = ["rlib"]

[features]
# Avalonia is X11 backed with XLib. There is some work for Avalonia 12 to have wayland though.
default = ["linux_xlib"]
std = []
linux_xlib = []
linux_xcb = []
linux_wayland = []
physical_mesh_debug_normals = []
cursor_debug = []

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc = { version = "0.2.7" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
image = "0.25.10"
ntest = "*"

[dependencies]
paste = "1.0"
ab_glyph = { version = "0.2.32", default-features = false, features = ["libm", "variable-fonts", "gvar-alloc"] }
aethervk-oshal-rlib = { path = "../../aethervk.oshal/rlib", default-features = false, features = ["console_log"] }
static_assertions = "1.1.0"
spin = { version = "0.10", features = ["once", "rwlock", "mutex"] }
thiserror = { version = "2", default-features = false }
bitflags = { version = "2.11", default-features = false }
heapless = { version = "0.9" }
itertools = { version = "0.14", default-features = false }
ouroboros = { version = "0.18", default-features = false }
slotmap = { version = "1.1.1", default-features = false }
hashbrown = { version = "0.17" }
# Model Loading
gltf = { version = "1.4.0", path = "../../external/gltf" }
# cannot enable gltf feature cause it imports std
polyhedral_mass_properties = "0.2.2"
ahash = { version = "0.8", default-features = false }
bytemuck = { version = "1.15", default-features = false }
# Texture Loading
png-decoder = { version = "0.2.0" }
zune-jpeg = { version = "0.5.14", default-features = false, features = ["x86", "neon"] }
zune-core = "0.5.1"
ktx2 = { version = "0.5.0", default-features = false }
# SPIR-V Shaders
spirv = "0.4.0+sdk-1.4.341.0"
spirv-reflect = { path = "../../external/spirv-reflect", default-features = false }
# anise library for almanac about SPK files and planet motion data
anise = { path = "../../external/anise/anise", default-features = false }
bytes = { version = "1", default-features = false }
thingbuf = "0.1.6"

[target.'cfg(all(not(target_arch = "wasm32"), any( target_os = "windows", target_os = "linux", target_os = "macos", target_os = "android", target_os = "ios")))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["debug"] }
vk-mem = { version = "0.5", path = "../../external/vk-mem", default-features = false, features = [
    "force-loaded",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = ">=0.59, <=0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
] }

[target.'cfg(target_family = "unix")'.dependencies]
libc = { version = "0.2", default-features = false, features = [
    "extra_traits",
] }

[profile.default]
# after doing `cargo install cargo-nextest`
# configuration for `cargo nextest run`
# Fail the test if it takes longer than 10 seconds
slow-timeout = { period = "10s", terminate-after = 1 }
