[package]
name = "aethervk-core-cdylib"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[lib]
name = "aethervk_core_cdylib"
crate-type = ["cdylib"]

[features]
default = []
std = []

[build-dependencies]
anyhow = { version = "1.0" }
serde_json = "1.0"
glob = "0.3"
cbindgen = "0.26.0"

[dependencies]
aethervk-core-rlib = { path = "../rlib", default-features = false, features = [
    "linux_xlib"
] }
aethervk-oshal-rlib = { path = "../../aethervk.oshal/rlib", default-features = false, features = [
    "console_log",
] }
anise = { path = "../../external/anise/anise", default-features = false }
bytes = { version = "1.11.1", default-features = false }
heapless = { version = "0.9" }
spin = { version = "0.10", features = ["once", "rwlock", "mutex"] }
thingbuf = { version = "0.1", default-features = false, features = ["alloc"] }
libc = { version = "0.2", default-features = false }
bytemuck = { version = "1.15", default-features = false, features = ["derive"] }

# crates necessary to avoid std
# core, alloc → `rustc` already has them
# - global allocator
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.5", features = ["disable_initial_exec_tls"] }

[target.'cfg(target_env = "msvc")'.dependencies] # if necessary, "secure" in debug
mimalloc = { version = "0.1", features = ["v3"] }

# vulkan available only on an OS
[target.'cfg(all(not(target_arch = "wasm32"), any( target_os = "windows", target_os = "linux", target_os = "macos", target_os = "android", target_os = "ios")))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["debug"] }

[target.'cfg(windows)'.dependencies]
windows = { version = ">=0.59, <= 0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_SystemServices",
] }
windows-strings = { version = "0.5", default-features = false }
wchar = "0.11"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dev-dependencies]
ntest = "0.9.5"