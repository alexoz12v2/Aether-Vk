[package]
name = "aethervk-oshal-rlib"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[lib]
name = "aethervk_oshal_rlib"
crate-type = ["rlib"]

[features]
default = []
std = []

[dependencies]
heapless = { version = "0.9"}
spin = { version = "0.10", features = ["once", "rwlock"] }
libm = { version = "0.2.11"}

[target.'cfg(windows)'.dependencies]
windows = { version = ">=0.59, <= 0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Globalization",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
windows-strings = { version = "0.5", default-features = false }
wchar = "0.11"

[target.'cfg(target_family = "unix")'.dependencies]
libc = { version = "0.2", default-features = false, features = [ "extra_traits" ]  }

# settings to strip and optimize release
# in rlib we don't care of how panic is handled
[profile.release]
lto = true
codegen-units = 1
strip = true