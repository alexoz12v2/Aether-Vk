[package]
name = "aethervk-oshal-rlib"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[lib]
name = "aethervk_oshal_rlib"
crate-type = ["rlib"]

[features]
default = ["console_log"]
std = []
console_log = []

[dependencies]
heapless = { version = "0.9" }
spin = { version = "0.10", features = ["once", "rwlock"] }
libm = { version = "0.2.11" }
thiserror = { version = "2", default-features = false }
# bumpalo = { version = "3.20.0", features = ["boxed"] }
# dependency of bumpalo 3.20.2
# allocator-api2 = { version = "0.2.8", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = ">=0.59, <= 0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Performance",
    "Win32_UI_Shell",
] }
windows-strings = { version = "0.5", default-features = false }
wchar = "0.11"

[target.'cfg(target_family = "unix")'.dependencies]
libc = { version = "0.2", default-features = false, features = [
    "extra_traits",
] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = { version = "0.6", default-features = false }
