[package]
name = "spawn_comet_debug"
version = "0.1.0"
edition = "2024"

[dependencies]
test_utils = { path = "../test_utils" }
aethervk-core-rlib = { path = "../../aethervk.core/rlib", default-features = false, features = [
  "std",
  # "shader_debug_sync"
] }
aethervk-oshal-rlib = { path = "../../aethervk.oshal/rlib", default-features = false, features = ["console_log"] }
winit = { version = "0.29.15", features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
windows = { version = ">=0.59, <= 0.62", default-features = false, features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-strings = { version = "0.5", default-features = false }
wchar = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSResponder",
  "NSView",
  "objc2-quartz-core",
  "NSWindow",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "CALayer",
  "CAMetalLayer",
  "objc2-metal",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSNotification",
  "NSString",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
  "MTLDevice",
] }

[features]
physical_mesh_debug_normals = ["aethervk-core-rlib/physical_mesh_debug_normals"]
cursor_debug = ["aethervk-core-rlib/cursor_debug"]
spotless_rendering = []
shader_debug_sync = ["aethervk-core-rlib/shader_debug_sync"]
force_debug = ["aethervk-core-rlib/shader_debug_sync"]