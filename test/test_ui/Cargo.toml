[package]
name = "test_ui"
version = "0.1.0"
edition = "2024"

[dependencies]
test_utils = { path = "../test_utils" }
aethervk-core-rlib = { path = "../../aethervk.core/rlib", default-features = false, features = ["std", "debug_gpu"] }
aethervk-oshal-rlib = { path = "../../aethervk.oshal/rlib", default-features = false, features = [
  "console_log",
] }
winit = { version = "0.29.15", features = ["rwh_06"] }

[features]
default = ["debug_gpu"]
debug_gpu = ["aethervk-core-rlib/debug_gpu"]

