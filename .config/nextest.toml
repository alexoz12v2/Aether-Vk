[profile.default]
# WORKAROUND: Prevent Vulkan GPU-AV from leaking File Descriptors 
# during rapid test setups/teardowns by disabling dynamic library unloading.
#
# `VK_LOADER_LAYERS_DISABLE=~implicit~`: no third-party implicit layer (OBS capture, Steam overlay,
# Nsight, RenderDoc) is injected into a test; the Khronos layers the engine enables itself still
# load, and so do the GPU drivers' own layers (`VK_LOADER_LAYERS_ALLOW`: NVIDIA Optimus/present,
# AMD switchable graphics, which pick the GPU on hybrid laptops). To capture a test with RenderDoc
# or Nsight, override it, e.g. VK_LOADER_LAYERS_DISABLE="".
env = { VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING = "1", VK_LOADER_LAYERS_DISABLE = "~implicit~", VK_LOADER_LAYERS_ALLOW = "VK_LAYER_NV_optimus,VK_LAYER_NV_present,VK_LAYER_AMD_switchable_graphics*" }
test-threads = 8
# A test is reported SLOW after 1 min and killed after 5 (a hung Vulkan test or a runaway
# host-rasterizer test); the Vulkan group's retries still apply after a termination.
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
# The host reference rasterizer renders a 262 144-slot system on the CPU: ~1.5 min in a debug
# build on 16 cores, minutes on fewer (`DUST_TEST_THREADS`), so it gets a longer kill limit.
filter = 'test(dust_image_is_independent_of_ring_capacity)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.default.overrides]]
# GPU parity tests whose CPU mirror runs every frame in a debug build: the handover parities
# compare ~470 frames (6.5 and 10 min on the GTX 1070, 2026-10-31), the spinning-site perspective
# splats the spiral on the CPU for each split family (6.5 min)
filter = 'test(gpu_dust_cadence_handover) | test(=gpu_backends::vulkan::device::test_dust::gpu_dust_splat_matches_reference_spinning_site_perspective)'
slow-timeout = { period = "60s", terminate-after = 15 }

[test-groups]
vulkan-tests = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(vulkan_math_tests) | test(physics_tests)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
# Apply the Vulkan test group concurrency limit to all tests that spawn a Vulkan frontend.
# This includes the low-level Vulkan tests, higher-level Simulation API integration tests, and dust config tests.
filter = 'test(gpu_backends::vulkan) | test(simulation_api) | test(test_dust_config) | test(logic_thread_tests)'
test-group = "vulkan-tests"
threads-required = "num-test-threads"
# Safety net: device creation already backs off and retries in-process (`init_device`); anything
# still lost to the driver (a device lost mid-test while the previous process tears down) is
# retried after a pause and reported as FLAKY, not FAIL.
retries = { backoff = "exponential", count = 2, delay = "2s", jitter = true }

# CI (headless, Vulkan on lavapipe): run every test instead of stopping at the first failure,
# and leave out tests that need real GPU throughput.
[profile.ci]
fail-fast = false
# Renders a full dust ring at 1280 x 800 for 2 x 240 frames: ~10 s per frame on lavapipe, so it
# cannot finish inside the 5 min limit.
default-filter = 'not (package(aethervk-core-rlib) & test(=gpu_backends::vulkan::device::dust::cadence::tests::gpu_dust_budget_loop_keeps_the_ladder_order))'

# Local triage on a GPU box where some tests hang: a 30 s kill instead of 5 min, no retries
# (`cargo nextest run --profile triage`); a test killed here may just be slow, so rerun it alone
# under the default profile before calling it a hang.
[profile.triage]
slow-timeout = { period = "30s", terminate-after = 1 }
retries = 0
fail-fast = false
