[profile.default]
# WORKAROUND: Prevent Vulkan GPU-AV from leaking File Descriptors 
# during rapid test setups/teardowns by disabling dynamic library unloading.
env = { VK_LOADER_DISABLE_DYNAMIC_LIBRARY_UNLOADING = "1" }
test-threads = 8
# A test is reported SLOW after 1 min and killed after 5 (a hung Vulkan test or a runaway
# host-rasterizer test); the Vulkan group's retries still apply after a termination.
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
# The host reference rasterizer renders a 262 144-slot system on the CPU: ~1.5 min in a debug
# build on 16 cores, minutes on fewer (`DUST_TEST_THREADS`), so it gets a longer kill limit.
filter = 'test(dust_image_is_independent_of_ring_capacity)'
slow-timeout = { period = "60s", terminate-after = 20 }

[test-groups]
vulkan-tests = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(vulkan_math_tests) | test(physics_tests)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
# Apply the Vulkan test group concurrency limit to all tests that spawn a Vulkan frontend.
# This includes the low-level Vulkan tests, higher-level Simulation API integration tests, and dust config tests.
filter = 'test(gpu_backends::vulkan) | test(simulation_api) | test(test_dust_config) | test(logic_thread_tests)'
test-group = "vulkan-tests"
threads-required = "num-test-threads"
# Safety net: device creation already backs off and retries in-process (`init_device`); anything
# still lost to the driver (a device lost mid-test while the previous process tears down) is
# retried after a pause and reported as FLAKY, not FAIL.
retries = { backoff = "exponential", count = 2, delay = "2s", jitter = true }
