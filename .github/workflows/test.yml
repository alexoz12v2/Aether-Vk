name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the test job
        type: boolean
        default: true

# use the committed SPIR-V blobs (built with the pinned SDK) instead of rebuilding them with the
# runner's tools: see aethervk.core/rlib/build.rs
env:
  AETHERVK_PREBUILT_SHADERS: "1"
  # CFITSIO is built by vcpkg from aethervk.cfitsio/sys/build.rs: keep its source downloads in one
  # cacheable folder (the binary cache is <repo>/.vcpkg-bincache)
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg/downloads

jobs:
  compile:
    name: Compile ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-pc-windows-msvc
            os: windows-2025
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
    # Generated files in the repo exceed MAX_PATH on Windows; enable long paths before checkout
    - name: Enable long paths (Windows)
      if: runner.os == 'Windows'
      run: git config --global core.longpaths true

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libfontconfig1 libx11-6 libx11-xcb1 libxcb-dri3-0 libwayland-client0 xvfb xz-utils curl zip unzip tar pkg-config cmake ninja-build

    # vcpkg's arm64-linux triplet cross-compiles CFITSIO with aarch64-linux-gnu-gcc from this package
    - name: Install cross-compiler (Linux aarch64)
      if: matrix.target == 'aarch64-unknown-linux-gnu' && runner.os == 'Linux'
      run: |
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-09-26 # keep in sync with rust-toolchain.toml
        targets: ${{ matrix.target }}

    # the SDK the SPIR-V blobs are built with: pinned in .vulkan-sdk-version (see compile_shaders.sh)
    - name: Read pinned Vulkan SDK version
      id: vksdk
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < .vulkan-sdk-version)" >> "$GITHUB_OUTPUT"

    - name: Setup Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1.5.5
      with:
        vulkan_version: ${{ steps.vksdk.outputs.version }}

    # CFITSIO (aethervk.cfitsio/sys): vcpkg's binary cache and the downloads (vcpkg tarball, sources)
    - name: Cache vcpkg (CFITSIO)
      uses: actions/cache@v4
      with:
        path: |
          .vcpkg-bincache
          .vcpkg/downloads
          .vcpkg/vcpkg-*.tar.gz
        key: vcpkg-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('aethervk.cfitsio/sys/build.rs') }}
        restore-keys: vcpkg-${{ runner.os }}-${{ matrix.target }}-

    - name: Create vcpkg folders
      shell: bash
      run: mkdir -p .vcpkg/downloads .vcpkg-bincache

    - name: Cargo Check
      run: cargo check --locked --all-targets --target ${{ matrix.target }}
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++

    # the pure-Rust FITS fallback (no CFITSIO) must keep compiling: it is the per-target release fallback
    - name: Cargo Check (without CFITSIO)
      run: cargo check --locked -p aethervk-core-cdylib --no-default-features --target ${{ matrix.target }}
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++

  test:
    # Opt-in: runs only when the repository variable RUN_TESTS is set to 'true', or on a manual
    # dispatch with run_tests checked (`gh workflow run Test -f run_tests=true`)
    # (Settings > Secrets and variables > Actions > Variables, or `gh variable set RUN_TESTS --body true`)
    if: vars.RUN_TESTS == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_tests)
    needs: compile
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers libfontconfig1 libx11-6 libx11-xcb1 libxcb-dri3-0 libwayland-client0 xvfb xz-utils cmake ninja-build python3 build-essential pkg-config git curl zip unzip tar
    - name: Install Vulkan-ExtensionLayer
      run: |
        sudo mkdir -p /usr/share/vulkan/explicit_layer.d
        sudo cp workflow-data/vulkan-synchronization2/VkLayer_khronos_synchronization2.json /usr/share/vulkan/explicit_layer.d/
        sudo cp workflow-data/vulkan-synchronization2/libVkLayer_khronos_synchronization2.so /usr/lib/

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # as specified in global.json

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-09-26 # keep in sync with rust-toolchain.toml
        components: rustfmt, llvm-tools-preview

    # build.rs compiles shaders with glslc from VULKAN_SDK
    # the SDK the SPIR-V blobs are built with: pinned in .vulkan-sdk-version (see compile_shaders.sh)
    - name: Read pinned Vulkan SDK version
      id: vksdk
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < .vulkan-sdk-version)" >> "$GITHUB_OUTPUT"

    - name: Setup Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1.5.5
      with:
        vulkan_version: ${{ steps.vksdk.outputs.version }}

    # CFITSIO (aethervk.cfitsio/sys): vcpkg's binary cache and the downloads (vcpkg tarball, sources)
    - name: Cache vcpkg (CFITSIO)
      uses: actions/cache@v4
      with:
        path: |
          .vcpkg-bincache
          .vcpkg/downloads
          .vcpkg/vcpkg-*.tar.gz
        key: vcpkg-${{ runner.os }}-x86_64-unknown-linux-gnu-${{ hashFiles('aethervk.cfitsio/sys/build.rs') }}
        restore-keys: vcpkg-${{ runner.os }}-x86_64-unknown-linux-gnu-

    - name: Create vcpkg folders
      shell: bash
      run: mkdir -p .vcpkg/downloads .vcpkg-bincache

    # test assets (test_assets/ASSETS.tsv): the tarballs of the test-assets release, downloaded
    # by the tests themselves into target/test-assets on a cache miss
    - name: Cache test assets
      uses: actions/cache@v4
      with:
        path: target/test-assets
        key: test-assets-${{ hashFiles('test_assets/ASSETS.tsv') }}

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov@0.9.1

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@0.9.137

    - name: Restore .NET local tools
      run: dotnet tool restore

    - name: Setup Workspace Assets
      run: ./setup_workspace.sh

    - name: Execute Tests
      run: xvfb-run -a ./execute_tests.sh
      env:
        # .config/nextest.toml: no fail-fast, skip tests that need real GPU throughput
        NEXTEST_PROFILE: ci
        # a test whose asset cannot be downloaded fails here instead of skipping
        AETHERVK_TEST_ASSETS_REQUIRED: "1"
        # Force Vulkan to use lavapipe for headless environments
        VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        # TODO: We will remove this when we figure out why it acts out
        AETHERVK_DISABLE_GPU_AV: "1"

        GALLIVM_PERF: no_opt
        LP_DEBUG: no_opt
        RUST_MIN_STACK: 33554432
