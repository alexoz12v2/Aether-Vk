name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the test job
        type: boolean
        default: true

jobs:
  compile:
    name: Compile ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-pc-windows-msvc
            os: windows-2025
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
    # Generated files in the repo exceed MAX_PATH on Windows; enable long paths before checkout
    - name: Enable long paths (Windows)
      if: runner.os == 'Windows'
      run: git config --global core.longpaths true

    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libfontconfig1 libx11-6 libx11-xcb1 libxcb-dri3-0 libwayland-client0 xvfb xz-utils

    - name: Install cross-compiler (Linux aarch64)
      if: matrix.target == 'aarch64-unknown-linux-gnu' && runner.os == 'Linux'
      run: |
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-09-26 # keep in sync with rust-toolchain.toml
        targets: ${{ matrix.target }}

    - name: Setup Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1.5.5
      with:
        vulkan_version: '1.4.321.0'

    - name: Cargo Check
      run: cargo check --locked --all-targets --target ${{ matrix.target }}
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++

  test:
    # Opt-in: runs only when the repository variable RUN_TESTS is set to 'true', or on a manual
    # dispatch with run_tests checked (`gh workflow run Test -f run_tests=true`)
    # (Settings > Secrets and variables > Actions > Variables, or `gh variable set RUN_TESTS --body true`)
    if: vars.RUN_TESTS == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_tests)
    needs: compile
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers libfontconfig1 libx11-6 libx11-xcb1 libxcb-dri3-0 libwayland-client0 xvfb xz-utils cmake ninja-build python3 build-essential pkg-config git
    - name: Install Vulkan-ExtensionLayer
      run: |
        sudo mkdir -p /usr/share/vulkan/explicit_layer.d
        sudo cp workflow-data/vulkan-synchronization2/VkLayer_khronos_synchronization2.json /usr/share/vulkan/explicit_layer.d/
        sudo cp workflow-data/vulkan-synchronization2/libVkLayer_khronos_synchronization2.so /usr/lib/

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # as specified in global.json

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-09-26 # keep in sync with rust-toolchain.toml
        components: rustfmt, llvm-tools-preview

    # build.rs compiles shaders with glslc from VULKAN_SDK
    - name: Setup Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1.5.5
      with:
        vulkan_version: '1.4.321.0'

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov@0.9.1

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@0.9.137

    - name: Restore .NET local tools
      run: dotnet tool restore

    - name: Setup Workspace Assets
      run: ./setup_workspace.sh

    - name: Execute Tests
      run: xvfb-run -a ./execute_tests.sh
      env:
        # Force Vulkan to use lavapipe for headless environments
        VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        # TODO: We will remove this when we figure out why it acts out
        AETHERVK_DISABLE_GPU_AV: "1"

        GALLIVM_PERF: no_opt
        LP_DEBUG: no_opt
        RUST_MIN_STACK: 33554432
