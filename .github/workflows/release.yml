name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    name: Release ${{ matrix.dotnet_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            dotnet_arch: osx-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            dotnet_arch: osx-x64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            dotnet_arch: win-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            dotnet_arch: win-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            dotnet_arch: linux-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            dotnet_arch: linux-x64

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libfontconfig1 libx11-6 libx11-xcb1 libxcb-dri3-0 libwayland-client0

    - name: Install cross-compiler (Linux aarch64)
      if: matrix.target == 'aarch64-unknown-linux-gnu' && runner.os == 'Linux'
      run: |
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

    - name: Setup Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1.5.5
      with:
        vulkan_version: '1.4.321.0'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Restore .NET local tools
      run: dotnet tool restore

    - name: Setup Workspace Assets
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          pwsh ./setup_workspace.ps1
        else
          bash ./setup_workspace.sh
        fi
      shell: bash

    - name: Determine Release Mode
      id: mode
      run: |
        if [[ "${{ github.ref }}" == *"-sxs" ]]; then
          echo "MODE=SideBySide" >> $GITHUB_ENV
        else
          echo "MODE=Normal" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Package Windows
      if: runner.os == 'Windows'
      run: |
        pwsh ./scripts/package_windows.ps1 -Arch ${{ matrix.dotnet_arch }}
        $msixArch = if ('${{ matrix.dotnet_arch }}' -eq 'win-x64') { 'x64' } else { 'arm64' }
        if ($env:MODE -eq "SideBySide") {
            pwsh ./scripts/package_windows_msix.ps1 -Arch $msixArch -SideBySide
        } else {
            pwsh ./scripts/package_windows_msix.ps1 -Arch $msixArch
        }

    - name: Package macOS
      if: runner.os == 'macOS'
      run: |
        bash ./scripts/package_macos.sh ${{ matrix.dotnet_arch }} Release $MODE
        cd bin/publish
        zip -r AetherVk_1.0.0_${{ matrix.dotnet_arch }}.zip AetherVk*.app

    - name: Package Linux
      if: runner.os == 'Linux'
      run: |
        bash ./scripts/package_linux.sh ${{ matrix.dotnet_arch }}
        bash ./scripts/package_linux_deb.sh ${{ matrix.dotnet_arch }} Release $MODE
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++

    - name: Publish Release Artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          bin/publish/AetherVk_1.0.0_${{ matrix.dotnet_arch }}.zip
          bin/publish/AetherVk_1.0.0_${{ matrix.dotnet_arch }}.tar.gz
          bin/publish/*.msix
          bin/publish/*.deb
